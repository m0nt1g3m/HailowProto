syntax = "proto3";

package SellerService.v1.types;

import "google/protobuf/timestamp.proto";
import "AuthService/v1/types/auth_types.proto";

option csharp_namespace = "HailowApiGateway.Protos.SellerService.Types";
option go_package = "SellerService/v1;SellerService";

message Seller {
    string id = 1;
    optional string avatar_url = 2;
    string first_name = 3;
    string last_name = 4;
    string email = 5;
    string phone_number = 6;
    string city = 7;
    string street = 8;
    string building = 9;
    optional int32 porch = 10;
    optional int32 floor = 11;
    optional int32 flat = 12;
    Role role = 13;
    google.protobuf.Timestamp created_at = 14;
    google.protobuf.Timestamp updated_at = 15;
}