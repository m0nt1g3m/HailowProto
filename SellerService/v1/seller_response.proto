syntax = "proto3";

package SellerService.v1;

import "SellerService/v1/types/seller_types.proto";
import "SellerService/v1/types/auth_types.proto";

option csharp_namespace = "HailowApiGateway.Protos.SellerService";
option go_package = "SellerService/v1;SellerService";

message SignUpResponse {
    SellerService.v1.types.Seller seller = 1;
}

message SignInResponse {
    string id = 1;
    SellerService.v1.types.TokenPair tokens = 2;
}

message RefreshTokensResponse {
    string access_token = 1;
}

message ValidateTokenResponse {
    bool is_valid = 1;
}

message UploadStoreLogoResponse {
    string logo_url = 1;
}

message UpdateProfileResponse {
    SellerService.v1.types.Seller seller = 1;
}

message SetActiveStatusResponse {
    SellerService.v1.types.Seller seller = 1;
}

message UpdateLocationInfoResponse {
    SellerService.v1.types.Seller seller = 1;
}

message ResetPasswordResponse {
    bool success = 1;
}

message GetProfileResponse {
    SellerService.v1.types.Seller seller = 1;
}

message DeleteAccountResponse {
    bool success = 1;
}

message LogoutResponse {
    bool success = 1;
}