syntax = "proto3";

package AuthService.v1.types;

option csharp_namespace = "HailowApiGateway.Protos.AuthService.Types";
option go_package = "AuthService/v1;AuthService";

enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_CUSTOMER = 1;
    ROLE_ADMIN = 2;
}

message TokenPair {
    string access_token = 1;
    string refresh_token = 2;
}