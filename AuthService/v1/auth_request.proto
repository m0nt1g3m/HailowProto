syntax = "proto3";

package AuthService.v1;

option csharp_namespace = "HailowApiGateway.Protos.AuthService";
option go_package = "AuthService/v1;AuthService";

message ModeratorSignUpRequest {
    string first_name = 1;
    string last_name = 2;
    string email = 3;
    string password = 4;
}

message SellerSignUpRequest {
    string first_name = 1;
    string last_name = 2;
    string email = 3;
    string password = 4;
}

message CustomerSignUpRequest {
    string first_name = 1;
    string last_name = 2;
    string email = 3;
    string password = 4;
}

message SignInRequest {
    string email = 1;
    string password = 2;
}

message RefreshTokensRequest {
    string refresh_token = 1;
}

message ValidateTokenRequest {
    string access_token = 1;
}

message LogoutRequest {
    string refresh_token = 1;
}